name: Daily Shenzhen Data Job Tracker

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write  # 显式开通仓库写入权限

jobs:
  run-tracker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4  # 升级到 v4 解决 Warning

      - name: Set up Python
        uses: actions/setup-python@v5  # 升级到 v5 解决 Warning
        with:
          python-version: '3.x'

      - name: Run Job Tracker Script
        env:
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECEIVER: ${{ secrets.EMAIL_RECEIVER }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
        run: python job_tracker.py

      - name: Commit and Push Updated CSV
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          if [ -f "shenzhen_2027_data_jobs.csv" ]; then
            git add shenzhen_2027_data_jobs.csv
            git commit -m "Auto update Shenzhen 2027 DA/DS/BA job list" || echo "No changes to commit"
            git push
          fi

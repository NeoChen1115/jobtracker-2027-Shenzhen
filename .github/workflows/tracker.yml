name: Daily Shenzhen Data Job Tracker

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-tracker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run Job Tracker Script
        env:
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECEIVER: ${{ secrets.EMAIL_RECEIVER }}
          EMAIL_GF_RECEIVER: ${{ secrets.EMAIL_GF_RECEIVER }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
        run: python job_tracker.py

      - name: Commit and Push Updated CSVs
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add shenzhen_all_jobs.csv shenzhen_data_jobs.csv || true
          git commit -m "Auto update Shenzhen 2027 job lists" || echo "No changes to commit"
          git push

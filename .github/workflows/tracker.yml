name: Daily Shenzhen Data Job Tracker

on:
  schedule:
    # 每天北京时间早上 8:00 自动运行 (UTC 时间 0:00)
    - cron: '0 0 * * *'
  workflow_dispatch: # 支持手动点击按钮触发运行

jobs:
  run-tracker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Run Job Tracker Script
        env:
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECEIVER: ${{ secrets.EMAIL_RECEIVER }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
        run: python job_tracker.py

      - name: Commit and Push Updated CSV
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add shenzhen_2027_data_jobs.csv
          git commit -m "Auto update Shenzhen 2027 DA/DS/BA job list" || exit 0
          git push